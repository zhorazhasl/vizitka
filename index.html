<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хажидулла Жасулан — визитка</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f1a, #1e1b2e);
      color: #f3f4f6;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 40px 32px;
      text-align: center;
      background: #1c1a29;
      border: 1px solid #2e2a42;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .avatar {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #7c3aed;
      color: #ffffff;
      font-size: 36px;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .profession {
      margin: 0 0 28px;
      color: #a1a1b5;
      font-size: 17px;
    }

    .button {
      display: inline-block;
      padding: 18px 40px;
      border-radius: 14px;
      background: #8b5cf6;
      color: #ffffff;
      font-size: 19px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
      transition: background 0.2s, transform 0.2s;
    }

    .button:hover {
      background: #7c3aed;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">ХЖ</div>
    <h1>Хажидулла Жасулан Еркинулы</h1>
    <p class="profession">Инженер-геолог</p>
    <a class="button" href="https://t.me/zhaslzhora" target="_blank" rel="noopener">Написать мне</a>
  </main>
</body>
</html>
